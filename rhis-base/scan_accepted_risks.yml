---
# Accepted security risks for rhis-base container builds.
#
# Each entry documents a CVE that has been reviewed and accepted.
# The build pipeline checks this file during policy enforcement —
# accepted CVEs produce warnings instead of build failures.
# Any NEW CVE not listed here will still fail the build.
#
# When a fix becomes available in the RHEL repos, remove the entry,
# rebuild, and verify the CVE is resolved.
#
# Read by: scan_base_post_build.yml
# Reviewed by: parmstro
# Last review: 2026-09-29
# Next review: 2026-10-13

